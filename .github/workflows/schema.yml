name: Alembic Schema
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: schema-ci-only
          MYSQL_DATABASE: stage3_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SCHEMA_TEST_DATABASE_URL: mysql+pymysql://root:schema-ci-only@127.0.0.1:3306/stage3_test_ci
      SECRET_KEY: ci-only-not-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-prod.lock
      - run: pip install -r requirements-dev.txt
      - name: Fresh MySQL, Alembic check, drift and startup without create_all
        run: PYTHONPATH=. python tests/verify_schema_runtime.py
      - name: Full tests including SQLite, Adoption, Cleanup and release failure gates
        run: python -m pytest -q
      - name: Lint Stage 3 files
        run: >-
          python -m ruff check app/main.py app/tasks/celery_app.py
          app/core/revision_guard.py app/core/schema_drift.py tests/conftest.py
          tests/test_revision_guard.py tests/verify_schema_runtime.py
          tests/test_deployment_flow.py ../scripts/check_runtime_storage.py
      - name: Deployment syntax and Compose configuration
        run: |
          bash -n ../scripts/deploy_production.sh ../scripts/update_production.sh ../scripts/production_release.sh
          docker compose -f ../docker-compose.yml --profile background config --quiet

  web:
    name: Web (TypeScript / Tests / Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 与 web/Dockerfile 完全一致的 pnpm 解析方式：Node 22 自带 corepack，
      # 因此 CI 与生产镜像使用同一个 pnpm 版本，无需在 package.json 里硬编码。
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm exec vue-tsc --noEmit
      - name: Unit tests
        run: pnpm exec vitest run
      - name: Production build
        run: pnpm build
      - name: Production Web image build
        working-directory: .
        run: docker build -f web/Dockerfile -t ai-study-web:ci .
