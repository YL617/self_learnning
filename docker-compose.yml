services:
  mysql:
    image: mysql:8.4
    container_name: ai-study-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_study_root}
      MYSQL_DATABASE: ai_study
      MYSQL_USER: ai_study
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_study_pass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --max-connections=100
      - --performance-schema=OFF
      - --skip-name-resolve

  redis:
    image: redis:7-alpine
    container_name: ai-study-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ai-study-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: ai-study-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://ai_study:${MYSQL_PASSWORD:-ai_study_pass}@mysql:3306/ai_study?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      AI_PROVIDER: deepseek
      AI_LOW_BALANCE_THRESHOLD: ${AI_LOW_BALANCE_THRESHOLD:-10}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      FREE_DAILY_AI_QUOTA: ${FREE_DAILY_AI_QUOTA:-20}
      BASIC_DAILY_AI_QUOTA: ${BASIC_DAILY_AI_QUOTA:-60}
      ADVANCED_DAILY_AI_QUOTA: ${ADVANCED_DAILY_AI_QUOTA:-120}
      FULL_DAILY_AI_QUOTA: ${FULL_DAILY_AI_QUOTA:-300}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mysql
      - redis

  worker:
    build: ./backend
    container_name: ai-study-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    profiles: ["background"]
    environment:
      DATABASE_URL: mysql+pymysql://ai_study:${MYSQL_PASSWORD:-ai_study_pass}@mysql:3306/ai_study?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_LOW_BALANCE_THRESHOLD: ${AI_LOW_BALANCE_THRESHOLD:-10}
    depends_on:
      - mysql
      - redis

  beat:
    build: ./backend
    container_name: ai-study-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    profiles: ["background"]
    environment:
      DATABASE_URL: mysql+pymysql://ai_study:${MYSQL_PASSWORD:-ai_study_pass}@mysql:3306/ai_study?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_LOW_BALANCE_THRESHOLD: ${AI_LOW_BALANCE_THRESHOLD:-10}
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
  redis_data:
